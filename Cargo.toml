[package]
name = "taxutils"
version = "1.0.8"
edition = "2024"
description = "Rust utilities for NCBI taxonomy data and FASTA files"
license = "MIT"
documentation = "https://docs.rs/taxutils"
homepage = "https://github.com/SwabSeq/taxutils-rs"
repository = "https://github.com/SwabSeq/taxutils-rs"
readme = "README.md"

[lib]
name = "taxutils"
path = "src/lib.rs"

[[bin]]
name = "tu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
regex = "1"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"
